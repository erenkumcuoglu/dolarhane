# Dolarhane — Netlify yapılandırması
# Site statik dışa aktarım; sunucu tarafı çalışma zamanı yok.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Güvenlik ve önbellek başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fontlar ve statik varlıklar içerik-adresli, uzun süre önbelleklenebilir
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /v4 deneme rotası 2026-09'da ana sayfa oldu; eski linkler kırılmasın.
# force: /v4/index.html dosyası dursa bile yönlendirme önce gelir.
[[redirects]]
  from = "/v4"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v4/*"
  to = "/"
  status = 301
  force = true
